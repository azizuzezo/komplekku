name: komplekku
description: Aplikasi mobile native untuk operasional lingkungan Komplekku.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  audioplayers: ^6.1.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/komplekku-lockup.png
    - assets/brand/komplekku-mark.png
    - assets/audio/adzan.mp3
    - assets/audio/iqomah.wav
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
