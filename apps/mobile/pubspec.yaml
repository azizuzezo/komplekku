name: komplekku
description: Aplikasi mobile native untuk operasional lingkungan Komplekku.
publish_to: none
# The `+N` build number is Android's versionCode — the integer the OS and the
# in-app updater compare. Bump it on every release you distribute, and set
# MOBILE_LATEST_VERSION_CODE on the API to the same number.
version: 0.4.1+5

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  timezone: ^0.10.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  flutter_local_notifications_platform_interface: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/komplekku-lockup.png
    - assets/brand/komplekku-mark.png
    - assets/audio/adzan.mp3
    - assets/audio/iqomah.wav
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

# Regenerates android/app/src/main/res/mipmap-*/ic_launcher* from the current
# brand mark — run `dart run flutter_launcher_icons` after the mark changes.
# The launcher icon was still the old forest-green "K + houses" placeholder
# from before the brand asset replacement; this points it at the same
# komplekku-mark.png used in-app. White background matches design.md's note
# that the compact mark assumes a light surface.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/komplekku-mark-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/komplekku-mark.png"
